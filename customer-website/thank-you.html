<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thank You - QA Clothing Factory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&amp;family=Playfair+Display:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="css/style.css" rel="stylesheet"/>
<style>
        .thankyou-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .thankyou-card {
            background: var(--gray-bg);
            padding: 3rem;
            border-radius: var(--border-radius-lg);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .thankyou-card i {
            font-size: 5rem;
            color: var(--success);
            margin-bottom: 1rem;
        }
        
        .thankyou-card h1 {
            margin-bottom: 1rem;
        }
        
        .btn-back {
            display: inline-block;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
<div class="thankyou-container">
<div class="thankyou-card">
<i class="fas fa-check-circle"></i>
<h1>Thank You!</h1>
<p id="confirmation-message">Your message has been sent successfully.</p>
<p id="quote-reference" style="display:none;overflow-wrap:anywhere"></p>
<p>A representative from QA Clothing Factory will get back to you within 24 business hours.</p>
<a class="btn-primary btn-back" href="track-quotation.html" id="track-quote-link">Track Your Quotation</a> <a class="btn-back" href="index.html">Return to Homepage</a>
</div>
</div>
<script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const reference = params.get('reference');
        if (params.get('type') !== 'quote' || !/^QA-[0-9]{8}-[A-Z0-9]{12}$/.test(reference || '')) return;
        document.getElementById('confirmation-message').textContent =
          'Your quotation request has been submitted successfully.';
        const display = document.getElementById('quote-reference');
        display.style.display = 'block';
        display.textContent = 'Your quotation reference: ' + reference;
        document.getElementById('track-quote-link').href = 'track-quotation.html?reference=' + encodeURIComponent(reference);
      })();
    </script>
</body>
</html>
