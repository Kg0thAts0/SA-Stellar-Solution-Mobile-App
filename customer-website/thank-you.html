<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - QA Clothing Factory</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .thankyou-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .thankyou-card {
            background: var(--gray-bg);
            padding: 3rem;
            border-radius: var(--border-radius-lg);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .thankyou-card i {
            font-size: 5rem;
            color: var(--success);
            margin-bottom: 1rem;
        }
        
        .thankyou-card h1 {
            margin-bottom: 1rem;
        }
        
        .btn-back {
            display: inline-block;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <div class="thankyou-container">
        <div class="thankyou-card">
            <i class="fas fa-check-circle"></i>
            <h1>Thank You!</h1>
            <p>Your message has been sent successfully.</p>
            <p>A representative from QA Clothing Factory will get back to you within 24 business hours.</p>
            <a href="index.html" class="btn-primary btn-back">Return to Homepage</a>
        </div>
    </div>

</body>
</html>
