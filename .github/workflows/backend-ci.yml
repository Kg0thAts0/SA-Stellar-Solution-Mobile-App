name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test ASP.NET Core API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend dependencies
        run: dotnet restore backend-api/QAClothingFactory.API/QAClothingFactory.API.csproj

      - name: Restore test dependencies
        run: dotnet restore backend-api/QAClothingFactory.Tests/QAClothingFactory.Tests.csproj

      - name: Build backend API
        run: dotnet build backend-api/QAClothingFactory.API/QAClothingFactory.API.csproj --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test backend-api/QAClothingFactory.Tests/QAClothingFactory.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=backend-tests.trx" --results-directory ./backend-test-results

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./backend-test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish backend API
        run: dotnet publish backend-api/QAClothingFactory.API/QAClothingFactory.API.csproj --configuration Release --no-restore --output ./backend-publish

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-clothing-factory-backend
          path: ./backend-publish/
          retention-days: 7

